
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1024" />
  <title>The GD list</title>

  <link rel="icon" href="/list_icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Estilos generales -->
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/typography.css" />
  <link rel="stylesheet" href="/css/main.css" />

  <!-- Estilos de páginas -->
  <link rel="stylesheet" href="/css/pages/home.css" />
  <link rel="stylesheet" href="/css/pages/list.css" />
  <link rel="stylesheet" href="/css/pages/leaderboard.css" />
  <link rel="stylesheet" href="/css/pages/roulette.css" />
  <link rel="stylesheet" href="/css/pages/changelog.css" />
  <link rel="stylesheet" href="/css/pages/challenge-list.css" />
  <link rel="stylesheet" href="/css/pages/comparator.css" />
  <link rel="stylesheet" href="/css/pages/demon-list.css" />

  <!-- Estilos de componentes -->
  <link rel="stylesheet" href="/css/components/nav.css" />
  <link rel="stylesheet" href="/css/components/btn.css" />
  <link rel="stylesheet" href="/css/components/tabs.css" />

  <!-- Vue y Vue Router -->
  <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>

<body id="app">
  <header :class="{ dark: store.dark }">
    <div class="logo">
      <h2>The GD List</h2>
      <p>v1.0.0</p>
    </div>

    <nav class="nav">
      <router-link class="nav__tab" to="/">
        <span class="type-label-lg">Home</span>
      </router-link>

      <div class="nav__dropdown">
        <router-link class="nav__tab" to="/list">
          <span class="type-label-lg">List</span>
        </router-link>

        <div class="nav__dropdown-menu">
          <router-link to="/list">Classic List</router-link>
          <router-link to="/demon-list">Demon List</router-link>
          <router-link to="/platformer-list">Platformer List</router-link>
          <router-link to="/challenge-list">
            The GD Challenge List
          </router-link>
          <router-link to="/hall-of-fame">
            🏆 Hall of Fame
          </router-link>
        </div>
      </div>

      <router-link class="nav__tab" to="/leaderboard">
        <span class="type-label-lg">Leaderboard</span>
      </router-link>

      <router-link class="nav__tab" to="/packs">
        <span class="type-label-lg">Packs</span>
      </router-link>

      <router-link class="nav__tab" to="/roulette">
        <span class="type-label-lg">Roulette</span>
      </router-link>

      <router-link class="nav__tab" to="/comparator">
        <span class="type-label-lg">Comparator</span>
      </router-link>

      <router-link class="nav__tab" to="/changelog">
        <span class="type-label-lg">Changelog</span>
      </router-link>

      <div class="nav__actions">
        <button
          class="nav__icon"
          @click.prevent="store.toggleDark()"
          aria-label="Toggle dark mode"
        >
          <img
            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
            alt=""
          />
        </button>

        <a class="nav__icon" href="#">
          <img src="/assets/discord.svg" alt="Discord Logo" />
        </a>

        <a class="nav__cta type-label-lg" href="#" target="_blank">
          Submit Record
        </a>
      </div>
    </nav>
  </header>

  <router-view :class="{ dark: store.dark }"></router-view>
</body>
</html>
